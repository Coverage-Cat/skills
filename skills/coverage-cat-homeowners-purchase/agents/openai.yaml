interface:
  display_name: "Coverage Cat Homeowners"
  short_description: "Run Coverage Cat's consumer-prefill or delegated homeowners flow"
  default_prompt: "Use $coverage-cat-homeowners-purchase to operate Coverage Cat's homeowners purchase workflow. Default to the consumer-prefill handoff when no operator bearer key is available in runtime, ask only for full name, email, and property address on a cold start, keep current-policy expiration in the one-time review turn as an estimated value two months from today instead of a standalone follow-up, allow numbered shorthand for occupancy and property type, fall back to the plain browser handoff only when prefill is unavailable, and only use the delegated flow when a real operator key is already present."
