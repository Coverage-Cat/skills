interface:
  display_name: "Umbrella Insurance Compare And Purchase"
  short_description: "Run Coverage Cat's consumer-prefill or delegated umbrella compare-and-purchase flow"
  default_prompt: "Use $umbrella-insurance-compare-and-purchase to operate Coverage Cat's umbrella purchase workflow. Start with https://www.coveragecat.com/agents.txt or https://www.coveragecat.com/.well-known/agents.txt, and do not drive the browser UI unless Coverage Cat should take over the shopper-facing flow. Default to the consumer-prefill handoff when no operator bearer key is available in runtime. If the runtime supports MCP, register `https://www.coveragecat.com/.well-known/mcp.json` in ChatGPT or use `https://www.coveragecat.com/api/consumer/mcp` for local Codex direct transport, do not use the manifest as the direct transport URL, and stay on the default consumer MCP subset: `umbrella_consumer_prefill`, `consumer_intake_issues`, `consumer_intake_patch`, `umbrella_consumer_select`, `umbrella_consumer_bind`, and `umbrella_consumer_attach`. That subset stays valid through `payment_needed` and `payment_url`, so do not switch to delegated tools just to reach checkout. On every pre-submit turn, tell the user the application is not submitted yet and Coverage Cat has not received a submitted application yet, render gathered details and remaining shopper-owned items as short labeled bullets or sections rather than a prose paragraph, mark any estimated bullet or value with `*`, include `* = estimated` once above and once below the list instead of prefixing lines with `[Estimated]`, and ask for any remaining shopper-owned details in plain English. For Monoline and Markel, keep declarations uploads in the post-choose flow, then poll until `payment_needed` and share the returned `payment_url`, which usually appears within about 5-10 minutes once those uploads are on file. Only use the delegated flow when a real operator key is already present."
