info:
  description: |-
    Which surface do you want? This document is the full contract and includes the delegated `/api/agent/*` endpoints, which require an operator-issued API key that Coverage Cat grants only to businesses transacting on behalf of their own customers. If you are a personal AI assistant shopping for your own human user, use `/api/consumer/openapi.yaml` instead: the consumer purchase flow for umbrella needs no Coverage Cat credential, and you should never ask the shopper for one. The `x-coverage-cat-surface` extension on each operation below marks which surface it belongs to.

    Delegated-agent APIs for Coverage Cat purchase workflows and read-only insurance tools. Umbrella delegated purchase is a one-review-page flow: the operator-side agent fills the application from allowed context, Coverage Cat returns estimated-field metadata, and the human only reviews or corrects the final JSON before preliminary quotes are generated. Credit consent is collected after the user chooses an offer, at the `select` step, before Coverage Cat can bind. Coverage Cat also exposes public consumer handoff endpoints at `/api/consumer/umbrella/prefill`, `/api/consumer/status`, and the direct follow-up intake endpoints under `/api/intake/{uid}`. On the direct follow-up path, authenticate with the latest rotated `intake_access_token`, use `PATCH /api/intake/{uid}` only for pre-submit review, correction, and submission, and continue umbrella post-choose follow-up through `/api/intake/{uid}/select`, `/api/intake/{uid}/bind`, and `/api/intake/{uid}/attach`.

    Every credit-consent or optional service-contact receipt must include `presented_at`: the actual current RFC 3339 date-time when the complete corresponding disclosure text was shown. Coverage Cat accepts a presentation time within the prior 24 hours and no more than five minutes in the future.

    Versioning: send the optional `Coverage-Cat-API-Version: v1` header to pin the stable agent API contract explicitly.

    Coverage Cat keeps `v1` as the current stable agent API version by default. If a future version supersedes it, Coverage Cat will announce the change in the developer portal and emit `Deprecation` and `Sunset` headers on the retiring version for at least 90 days before removal.

    Coverage Cat also echoes `X-Skill-Version: 1.0.0` so clients can log which published runtime-contract version served the response.

    Authenticated write operations also accept an `Idempotency-Key` header. Coverage Cat replays the cached successful response for the same operator, path, and key for 24 hours.

    Public consumer handoff endpoints live at `/api/consumer/umbrella/prefill`, `/api/consumer/status`, and the direct follow-up intake endpoints under `/api/intake/{uid}`.

    Rate-limited endpoints return `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`, and `RateLimit-Policy`. A `429` response also includes `Retry-After`.
