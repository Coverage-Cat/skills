---
components:
  headers:
    CoverageCatApiVersion:
      description: The Coverage Cat agent API version used to serve this response.
      schema:
        enum:
          - v1
        type: string
    Location:
      description: Absolute URL where the async delegated-homeowners job can be polled safely.
      schema:
        format: uri
        type: string
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
    RateLimitPolicy:
      description: Human-readable rate-limit policy for the current bucket.
      schema:
        type: string
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current rate-limit window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying a rate-limited request.
      schema:
        type: integer
    SkillVersion:
      description: Published Coverage Cat runtime-contract version for this response surface.
      schema:
        example: 1.0.0
        type: string
  parameters:
    CoverageCatApiVersion:
      description: Optional explicit Coverage Cat API version selector. Omit the header to use the current stable version.
      in: header
      name: Coverage-Cat-API-Version
      required: false
      schema:
        default: v1
        enum:
          - v1
        type: string
    DashboardCursor:
      description: Opaque cursor returned by a prior homeowners dashboard response.
      in: query
      name: cursor
      required: false
      schema:
        type: string
    IdempotencyKey:
      description: Optional idempotency key for authenticated write requests. Coverage Cat replays the cached successful response for the same operator, path, and key for 24 hours.
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
  schemas:
    AutoCalculatorRequest:
      additionalProperties: true
      properties:
        coverage:
          properties:
            collision_deductible:
              default: 1000
              type: integer
            comprehensive_deductible:
              default: 1000
              type: integer
          type: object
        driver:
          properties:
            age:
              default: 35
              type: integer
            gender:
              default: 'N'
              type: string
            state:
              default: CA
              type: string
            zip:
              type: string
          type: object
        repair_estimate:
          description: Used by the file-a-claim calculator.
          type: integer
        vehicle:
          properties:
            make:
              type: string
            model:
              type: string
            style:
              type: string
            submodel:
              type: string
            year:
              type: integer
          type: object
      type: object
    ConsumerStatusResponse:
      properties:
        detail_status:
          type: string
        line:
          enum:
            - umbrella
            - homeowners
          type: string
        offer_summary:
          $ref: '#/components/schemas/ConsumerOfferSummary'
        response_summary:
          type: string
        status:
          enum:
            - in_review
            - credit_consent_pending
            - quoted
            - bound
            - abandoned
          type: string
      type: object
    OfferSnapshot:
      properties:
        annual_price:
          type: integer
        carrier:
          type: string
        coverage_limit:
          type: string
        is_estimate:
          type: boolean
        price_range:
          properties:
            high:
              type: integer
            low:
              type: integer
          type:
            - object
            - 'null'
      type: object
    HomeownersMissingField:
      properties:
        description:
          type: string
        enum:
          items: {}
          type: array
        field:
          type: string
        format:
          type: string
        label:
          type: string
        message:
          type: string
        path:
          items:
            type: string
          type: array
        type:
          oneOf:
            - type: string
            - items:
                type: string
              type: array
      type: object
    HomeownersOfferSummary:
      properties:
        address:
          additionalProperties: true
          type: object
        annual_price:
          type: number
        carrier:
          type: string
        coverage_summary:
          type: string
        deductible:
          type: number
        dwelling_coverage:
          description: |
            Coverage A / replacement cost as priced by the carrier. Derived from a Replacement Cost Estimator, not from purchase price or appraised value; do not substitute either of those in operator-side displays.
          type: number
        is_estimate:
          type: boolean
        personal_liability:
          type: number
        policy_subtype:
          type: string
        policy_subtype_display:
          type: string
        property_id:
          description: Stable per operator plus normalized property address; reuse it as a property correlation key, not an intake-row identifier.
          type: string
        quote_number:
          type: string
        recommended:
          type: boolean
      type: object
    HomeownersDashboardResponse:
      properties:
        filters:
          additionalProperties: true
          type: object
        generated_at:
          type: string
        has_more:
          description: True when another dashboard page is available with the returned next_cursor.
          type: boolean
        next_cursor:
          description: Opaque cursor to request the next dashboard page.
          type: string
        operator_uid:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/HomeownersPropertyStatusRow'
          type: array
        property_count:
          type: integer
        status_counts:
          additionalProperties: true
          type: object
      type: object
    HomeownersPropertyStatusRow:
      properties:
        field_estimates:
          description: |
            Field-level estimates Coverage Cat filled for this property. See `HomeownersFieldEstimate` for handling rules. Estimated values keep quoting moving, but unconfirmed estimated home fields must still be reviewed in the homeowner portal before final bind.
          items:
            $ref: '#/components/schemas/HomeownersFieldEstimate'
          type: array
        fix_issues_email_available:
          description: |
            True when the operator may trigger Coverage Cat to send the homeowner a secure fix-issues email for this request UID.
          type: boolean
        home_index:
          type: integer
        home_ownership:
          type: string
        homeowner_fix_issues_request_login_url:
          description: |
            Shareable homeowner sign-in request page for the fix-issues flow. Use this when the property is still in `needs_more_info` and the homeowner should complete the missing items in Coverage Cat's GUI.
          format: uri
          type: string
        homeowner_quotes_request_login_url:
          description: |
            Shareable homeowner sign-in request page for the offers view. The homeowner still has to request their own login link by email, so this URL does not sign the operator or agent into the homeowner's private quotes page.
          format: uri
          type: string
        inserted_at:
          type: string
        location:
          additionalProperties: true
          type: object
        new_purchase:
          type: boolean
        offers_page_available:
          type: boolean
        offers_published:
          description: True once homeowners offers have been published to the homeowner's portal.
          type: boolean
        property_id:
          description: Stable per operator plus normalized property address; reuse it as a property correlation key, not an intake-row identifier.
          type: string
        property_type:
          type: string
        request_uid:
          type: string
        status:
          enum:
            - needs_more_info
            - pending_quotes
            - quoted
            - quotes_published
          type: string
        status_summary:
          description: Coarse operator-facing summary for the current status, without exact missing-field or offer counts.
          type: string
        submitted_at:
          type: string
        updated_at:
          type: string
      type: object
    ErrorResponse:
      additionalProperties: true
      properties:
        error:
          description: Stable machine-readable error code. Workflow clients should branch mainly on invalid_request, not_found, conflict, rate_limited, stale_token, sandbox_unsupported, and internal_error.
          enum:
            - invalid_request
            - not_found
            - conflict
            - rate_limited
            - idempotency_conflict
            - stale_token
            - sandbox_unsupported
            - credit_consent_required
            - internal_error
            - unauthorized
            - forbidden
            - key_expired
            - too_many_attempts
            - tool_not_found
            - tool_rate_limited
            - unsupported_api_version
            - invalid_email
            - invalid_otp
            - invalid_json
            - request_too_large
            - invalid_request_signature
          type: string
        message:
          description: Human-readable explanation of the failure.
          type: string
      type: object
    BindRequest:
      additionalProperties: false
      properties:
        intake:
          additionalProperties: true
          description: |
            Minimal patch answering only the fields from the current bind-stage `next_question`. Do not send quote-affecting changes here.
          type: object
        sandbox:
          description: |
            Optional sticky sandbox flag. Sandbox delegated umbrella sessions currently reject `bind` with `sandbox_unsupported`; this field is accepted so a client carrying the same request envelope does not fail schema validation first.
          type: boolean
        uid:
          type: string
      required:
        - uid
      type: object
    ToolBatchError:
      properties:
        error:
          type: string
        message:
          type: string
        reason:
          type: string
      type: object
    ConsumerPrefillResponse:
      properties:
        expires_at:
          format: date-time
          type: string
        polling_token:
          description: Opaque public token for coarse non-PII status polling.
          type: string
        resume_url:
          description: Short-lived Coverage Cat browser handoff URL for the prefilled review-and-consent page.
          format: uri
          type: string
        review_summary:
          additionalProperties: true
          description: Current non-authoritative review payload the agent may summarize before opening resume_url.
          type: object
      type: object
    AgentOffer:
      properties:
        annual_price:
          type: integer
        carrier:
          type: string
        choice_guidance:
          type: string
        coverage_limit:
          type: string
        display_notes:
          items:
            type: string
          type: array
        is_estimate:
          type: boolean
        price_range:
          properties:
            high:
              type: integer
            low:
              type: integer
          type:
            - object
            - 'null'
        rank:
          type: integer
        recommended:
          type: boolean
        selection_token:
          type: string
      type: object
    HomeownersQuotesRequest:
      additionalProperties: false
      properties:
        intake:
          additionalProperties: true
          description: |
            Partial homeowners intake patch containing the fullest currently known applicant and property facts you can assemble from approved operator-side context. For any non-user-confirmed home value you include under `intake.home[]`, also include a matching `intake.home[].field_estimates[]` row using the same object shape returned in responses. Those rows should mirror the current field value, carry an opaque provenance `source`, set `confirmed_by_user: false`, and include `estimated_at`; Coverage Cat will persist that value as an estimate and send the homeowner back through review before final bind in the consumer portal. Recommended submit pattern: omit or keep `credit_check_authorized` false until the real homeowner has reviewed the assembled application and explicitly consented to a soft credit pull that does not affect their credit score, then resend the same `uid` with `credit_check_authorized: true`. Do NOT derive homeowners dwelling replacement cost from purchase price or appraised value — that field must come from a Replacement Cost Estimator or be left for Coverage Cat's carrier-side estimator to fill. Do NOT send lender-side fields (note_rate, term_months, escrow flags); Coverage Cat prices homeowners premium directly and those inputs have no effect on the intake. Optional mortgage metadata such as `intake.home[].loans[].lender_name`, `loan_number`, `mortgagee_clause`, and `loan_effective_date` may be sent when available; partial loan rows are accepted. For enum/list fields, treat the `schema` and `missing_fields[].enum` returned by this endpoint as the authoritative allowed vocabulary for the current intake state.
          type: object
        sandbox:
          description: |
            Optional mocked-mode flag for delegated homeowners testing. Set this to true only when creating a brand-new delegated homeowners session. The sandbox flag sticks to that `uid`, reuses the real validation and one-time review/credit-consent checkpoint, skips live customer emails and carrier traffic, returns `pending_quotes` after the first successful submit, and returns mocked homeowners offers on a later poll of the same `uid`.
          type: boolean
        uid:
          description: Existing delegated homeowners intake identifier. Omit to create a new intake.
          type: string
      type: object
    ToolBatchRequest:
      additionalProperties: false
      properties:
        operations:
          items:
            $ref: '#/components/schemas/ToolBatchOperation'
          maxItems: 25
          minItems: 1
          type: array
      required:
        - operations
      type: object
    HomeownersQuotesResponse:
      properties:
        agent_instructions:
          items:
            type: string
          type: array
        homeowner_fix_issues_request_login_url:
          description: |
            Safe homeowner-facing sign-in request page for the fix-issues flow. Coverage Cat returns this while the delegated intake still needs more information and you want the homeowner to complete those remaining items in Coverage Cat's GUI.
          format: uri
          type: string
        homeowner_portal_url:
          deprecated: true
          description: |
            Secure Coverage Cat consumer portal link for this intake. The homeowner uses this portal to review details, choose an offer, confirm any estimated home answers, and complete final bind. Treat this as a sensitive direct session link; if you need a safer pass-through URL, use `homeowner_quotes_request_login_url`.
          format: uri
          type: string
        homeowner_quotes_request_login_url:
          description: |
            Safe homeowner-facing sign-in request page for the offers view. Share this with the homeowner when you need them to reach their offers page without handing over an operator or direct OTP login link.
          format: uri
          type: string
        job_id:
          description: Stable delegated-homeowners async job identifier. Reuses the intake uid.
          type: string
        known_summary:
          additionalProperties: true
          description: |
            Current delegated homeowners intake summary. This may include PII such as applicant name, applicant email, and full insured-property addresses. It may also include a `homes[].field_estimates[]` array per home listing values that were estimated by either the operator or Coverage Cat. Delegated quoting may proceed with these estimates, but unconfirmed estimated home fields are sent back through the homeowner review flow before final bind completes in Coverage Cat's consumer portal. Do not treat this object as safe-to-log telemetry.
          type: object
        missing_fields:
          items:
            $ref: '#/components/schemas/HomeownersMissingField'
          type: array
        offers:
          items:
            $ref: '#/components/schemas/HomeownersOfferSummary'
          type: array
        offers_page_url:
          deprecated: true
          description: Backwards-compatible alias for `homeowner_portal_url`.
          format: uri
          type: string
        operator_dashboard_url:
          description: Short-lived browser login link for the operator homeowners dashboard, usually prefiltered to this intake UID.
          format: uri
          type: string
        poll_after_seconds:
          description: Suggested minimum wait before polling again.
          type: integer
        poll_request:
          additionalProperties: true
          description: Structured POST request reference for polling the same delegated homeowners uid.
          type: object
        response_summary:
          type: string
        sandbox:
          description: True when this delegated homeowners response is mocked sandbox data.
          type: boolean
        schema:
          additionalProperties: true
          type: object
        status:
          enum:
            - needs_more_info
            - pending_quotes
            - quoted
          type: string
        status_endpoint:
          additionalProperties: true
          description: Structured status polling reference for the async job.
          type: object
        status_url:
          description: GET endpoint returning coarse non-PII status rows for this delegated homeowners request.
          format: uri
          type: string
        uid:
          type: string
      type: object
    ToolBatchResult:
      properties:
        error:
          $ref: '#/components/schemas/ToolBatchError'
        id:
          type: string
        result:
          additionalProperties: true
          type: object
        status:
          enum:
            - ok
            - error
          type: string
        tool:
          enum:
            - home_calculator
            - umbrella_calculator
            - auto_estimates
            - collision_and_comprehensive_coverage
            - file_a_claim
            - homeowners_agent_finder
          type: string
      type: object
    UmbrellaPendingField:
      properties:
        estimated:
          description: Whether `suggested_values` currently includes a fallback prior for this field.
          type: boolean
        field:
          type: string
        label:
          type: string
        number:
          type: integer
      type: object
    ConsumerPrefillRequest:
      additionalProperties: false
      properties:
        credit_consent_pending:
          const: true
          description: Must be true. Coverage Cat will hold the handoff at the one-shot review and consent checkpoint.
          type: boolean
        field_estimates:
          description: Optional estimate metadata for values that are defensible but not yet directly confirmed by the user.
          items:
            additionalProperties: true
            type: object
          type: array
        intake:
          additionalProperties: true
          description: Fullest currently known consumer application patch assembled from the user's own context before any piecemeal follow-up.
          type: object
      required:
        - intake
        - credit_consent_pending
      type: object
    AgentKeyRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
      required:
        - email
      type: object
    UmbrellaFieldEstimateInput:
      additionalProperties: false
      description: |
        Metadata for one umbrella answer in the draft request whose current value is not directly user-confirmed yet. The actual value still comes from the `intake` patch at the same field path.
      properties:
        confidence:
          enum:
            - low
            - medium
            - high
          type: string
        field:
          description: |
            Intake dot-path for the inferred answer, such as `marital_status`, `address.zip`, or `additional_drivers.0.license_state`.
          type: string
        source:
          description: |
            Opaque operator-side provenance label such as `crm`, `email_thread`, `policy_declarations`, or `historical_mode`.
          type: string
      required:
        - field
        - source
        - confidence
      type: object
    DraftRequest:
      additionalProperties: false
      properties:
        field_estimates:
          description: |
            Optional provenance rows for non-user-confirmed answers you included in the same `intake` payload, including values sourced from CRM, documents, email threads, or heuristics. Omit this only for values the human has directly confirmed. Coverage Cat may also add its own `historical_mode` estimates when it safely auto-prefills common umbrella defaults.
          items:
            $ref: '#/components/schemas/UmbrellaFieldEstimateInput'
          type: array
        intake:
          additionalProperties: true
          description: |
            Partial umbrella intake patch. Prefer sending the fullest context-backed application you can assemble from CRM, email threads, document drives, OCR'd policy files, and prior Coverage Cat sessions. Send only changed fields on follow-up calls instead of resubmitting the full application. Accepted aliases: `birthday -> age`, `spouse_birthday -> spouse_age`, `approximate_asset_value -> net_worth_numeric`. Send birthdays as ISO dates, not raw integer ages. Common keys include `full_name`, `email`, `phone_number`, `age`, `marital_status`, `license_status`, `license_state`, `license_number`, `address`, `occupation`, `line_of_work`, `net_worth_numeric`, `additional_drivers`, `household_members`, `auto_has_insurance`, `coverage_e_for_residences`, `has_citizens_home_coverage`, and `umbrella_details`.
          type: object
        sandbox:
          description: |
            Optional mocked-mode flag for delegated umbrella testing. Set this to true only when creating a brand-new delegated umbrella session. The sandbox flag sticks to that `uid`, reuses the real draft/review validation loop, returns mocked quote responses, and does not send live customer emails or carrier traffic.
          type: boolean
        uid:
          description: Existing delegated umbrella session identifier. Omit to create a new one.
          type: string
      type: object
    ToolBatchOperation:
      additionalProperties: false
      properties:
        id:
          type: string
        input:
          additionalProperties: true
          type: object
        tool:
          enum:
            - home_calculator
            - umbrella_calculator
            - auto_estimates
            - collision_and_comprehensive_coverage
            - file_a_claim
            - homeowners_agent_finder
          type: string
      required:
        - tool
        - input
      type: object
    HomeCalculatorRequest:
      additionalProperties: false
      properties:
        home_sqft:
          maximum: 25000
          minimum: 1
          type: integer
        risk_factors:
          description: Optional risk factor IDs returned by available_risk_factors.
          items:
            type: string
          type: array
        zip:
          pattern: ^[0-9]{5}$
          type: string
      required:
        - zip
        - home_sqft
      type: object
    HomeownersAgentFinderRequest:
      additionalProperties: false
      properties:
        limit:
          default: 25
          type: integer
        lines:
          description: Homeowners, dwelling_fire, condominium, renters, mobile_home, personal_lines, property_and_casualty, or surplus_lines.
          items:
            type: string
          type: array
        zip:
          pattern: ^[0-9]{5}$
          type: string
      required:
        - zip
        - lines
      type: object
    CalculatorResponse:
      additionalProperties: true
      description: Read-only calculator response. Shape varies by calculator.
      type: object
    NextAction:
      properties:
        display_note:
          type: string
        type:
          enum:
            - bind
          type: string
      type: object
    UmbrellaFieldEstimate:
      description: |
        One umbrella field whose current value is still estimated rather than directly user-confirmed. Use `review_path` to mark the same value in the `review` JSON when rendering the single consent-plus-review page.
      properties:
        confidence:
          enum:
            - low
            - medium
            - high
          type: string
        confirmed_by_user:
          description: Whether a later draft update re-sent the same value as a confirmed answer.
          type: boolean
        estimated_at:
          format: date-time
          type: string
        field:
          description: Intake dot-path for the estimated answer.
          type: string
        review_path:
          description: Path to the same value inside the `review` object.
          items:
            type: string
          type: array
        source:
          description: Provenance label for the estimate.
          type: string
        value:
          description: Current serialized intake value for the estimated field.
          type: string
      type: object
    QuoteResponse:
      properties:
        agent_instructions:
          items:
            type: string
          type: array
        compare_details_url:
          format: uri
          type: string
        field_estimates:
          description: |
            The estimated-field state that was present on the reviewed application. Use it to keep CRM estimate badges aligned with the review page the user approved.
          items:
            $ref: '#/components/schemas/UmbrellaFieldEstimate'
          type: array
        offers:
          items:
            $ref: '#/components/schemas/AgentOffer'
          type: array
        response_summary:
          type: string
        sandbox:
          description: True when the offer response is mocked sandbox data.
          type: boolean
        selection_guidance:
          properties:
            default_selection_token:
              type: string
            display_note:
              type: string
            summary:
              type: string
          type: object
        status:
          enum:
            - quoted
            - no_quotes
          type: string
        uid:
          type: string
      type: object
    DraftResponse:
      properties:
        agent_instructions:
          items:
            type: string
          type: array
        credit_consent_question:
          description: |
            Blocking consent prompt to render at the top of the single review page. The real user must personally answer Yes before quotes can be requested.
          type: string
        field_estimates:
          items:
            $ref: '#/components/schemas/UmbrellaFieldEstimate'
          type: array
        known_summary:
          additionalProperties: true
          description: |
            Current delegated umbrella application summary. This may include PII such as applicant name, email, phone number, and address; do not treat it as safe-to-log telemetry.
          type: object
        next_question:
          $ref: '#/components/schemas/NextQuestion'
        pending_fields:
          description: |
            Only present while Coverage Cat still needs more data before a final review page can be shown. Use this behind the scenes with operator-side context search; the intended UX is that the human only sees `ready_for_review`.
          items:
            $ref: '#/components/schemas/UmbrellaPendingField'
          type: array
        response_summary:
          type: string
        review:
          additionalProperties: true
          description: |
            Full review JSON to render only when `status` is `ready_for_review`. Show the `credit_consent_question` prominently first, then render this JSON below it and visually mark every `field_estimates[].review_path` entry as estimated.
          type: object
        review_token:
          description: Token bound to the latest review JSON. Refresh it after every draft edit before calling quotes.
          type: string
        sandbox:
          description: True when this delegated umbrella session is running in mocked sandbox mode.
          type: boolean
        status:
          enum:
            - needs_more_info
            - ready_for_review
            - ineligible
          type: string
        suggested_values:
          additionalProperties: true
          description: |
            Historical-mode fallback priors for unresolved fields. Treat these as hints for operator-side enrichment, not as substitutes for actual user or document-backed answers.
          type: object
        uid:
          type: string
      type: object
    SelectRequest:
      additionalProperties: false
      properties:
        sandbox:
          description: |
            Optional sticky sandbox flag. Sandbox delegated umbrella sessions currently reject `select` with `sandbox_unsupported`; this field is accepted so a client carrying the same request envelope does not fail schema validation first.
          type: boolean
        selection_confirmed:
          const: true
          type: boolean
        selection_token:
          type: string
        uid:
          type: string
      required:
        - uid
        - selection_token
        - selection_confirmed
      type: object
    SelectResponse:
      properties:
        agent_instructions:
          items:
            type: string
          type: array
        next_question:
          $ref: '#/components/schemas/NextQuestion'
        offers_url:
          description: Secure link to the Coverage Cat offers page for this delegated session.
          format: uri
          type: string
        payment_url:
          description: Secure payment-setup link, returned only when Coverage Cat is ready to collect payment.
          format: uri
          type: string
        post_choose:
          additionalProperties: true
          type: object
        required_upload_types:
          items:
            enum:
              - declarations
              - auto_declarations
            type: string
          type: array
        response_summary:
          type: string
        selected_offer:
          $ref: '#/components/schemas/OfferSnapshot'
        status:
          enum:
            - needs_more_info_to_bind
            - documents_needed
            - documents_pending_review
            - payment_needed
            - chosen
          type: string
        uid:
          type: string
      type: object
