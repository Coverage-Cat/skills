          description: |
            Whether a human has re-sent this field as a confirmed answer on a subsequent update, whether from the delegated operator payload or the homeowner reviewing the pre-filled value in Coverage Cat's portal.
          type: boolean
        estimated_at:
          format: date-time
          type: string
        field:
          description: Dot-path of the field on the intake (e.g. `property_type`).
          type: string
        source:
          description: |
            Opaque provenance label for the estimate. Common operator-side labels include `crm`, `email_thread`, `policy_declarations`, and `prior_coverage_cat_session`; Coverage Cat-generated labels include `loan_file`, `zillow`, `realtor`, `vintage_rule`, and `zdr_openai`. Treat unknown values as opaque; new sources may be added over time.
          type: string
        value:
          description: Estimated value. Type matches the underlying intake field.
      type: object
    ToolBatchResponse:
      properties:
        error_count:
          type: integer
        operation_count:
          type: integer
        results:
          items:
