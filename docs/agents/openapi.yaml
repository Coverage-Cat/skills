        at_fault_accidents:
          default: 0
          type: integer
        auto_count:
          default: 1
          type: integer
        drivers_over_70:
          default: 0
          type: integer
        drivers_under_22:
          default: 0
          type: integer
        jet_skis:
          default: 0
          type: integer
        large_watercraft:
          default: 0
          type: integer
        motorcycles:
          default: 0
          type: integer
        moving_violations:
          default: 0
          type: integer
        property_count:
          default: 1
          type: integer
        zip:
          pattern: ^[0-9]{5}$
          type: string
