        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerPrefillRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerPrefillResponse'
          description: Consumer umbrella handoff prepared.
          headers:
            Coverage-Cat-API-Version:
              $ref: '#/components/headers/CoverageCatApiVersion'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-Skill-Version:
              $ref: '#/components/headers/SkillVersion'
        '400':
