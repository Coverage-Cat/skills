---
components:
  headers:
    CoverageCatApiVersion:
      description: The Coverage Cat agent API version used to serve this response.
      schema:
        enum:
          - v1
        type: string
    Location:
      description: Absolute URL where the async delegated-homeowners job can be polled safely.
      schema:
        format: uri
        type: string
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
    RateLimitPolicy:
      description: Human-readable rate-limit policy for the current bucket.
      schema:
        type: string
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current rate-limit window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying a rate-limited request.
      schema:
        type: integer
    SkillVersion:
      description: Published Coverage Cat runtime-contract version for this response surface.
      schema:
        example: 1.0.0
        type: string
  parameters:
    CoverageCatApiVersion:
      description: Optional explicit Coverage Cat API version selector. Omit the header to use the current stable version.
      in: header
      name: Coverage-Cat-API-Version
      required: false
      schema:
        default: v1
        enum:
          - v1
        type: string
    DashboardCursor:
      description: Opaque cursor returned by a prior homeowners dashboard response.
      in: query
      name: cursor
      required: false
      schema:
        type: string
    IdempotencyKey:
      description: Optional idempotency key for consumer or operator write requests. Coverage Cat replays the cached successful response for the same subject, path, and key for 24 hours, and rejects a changed payload under the same key.
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
    IntakeUid:
      description: Coverage Cat intake uid returned by the consumer-prefill or intake creation step.
      in: path
      name: uid
      required: true
      schema:
        type: string
  schemas:
    AutoCalculatorRequest:
      additionalProperties: true
      properties:
        coverage:
          properties:
            collision_deductible:
              default: 1000
              type: integer
            comprehensive_deductible:
              default: 1000
              type: integer
          type: object
        driver:
          properties:
            age:
              default: 35
              type: integer
            gender:
              default: 'N'
              type: string
            state:
              default: CA
              type: string
            zip:
              type: string
          type: object
        repair_estimate:
          description: Used by the file-a-claim calculator.
          type: integer
        vehicle:
          properties:
            make:
              type: string
            model:
              type: string
            style:
              type: string
            submodel:
              type: string
            year:
              type: integer
          type: object
      type: object
    ConsumerStatusResponse:
      properties:
        detail_status:
          type: string
        line:
          enum:
            - umbrella
            - homeowners
          type: string
        offer_summary:
          $ref: '#/components/schemas/ConsumerOfferSummary'
        response_summary:
          type: string
        sandbox:
          type: boolean
        status:
          enum:
            - in_review
            - review_pending
            - credit_consent_pending
            - quoted
            - bound
            - abandoned
          type: string
      type: object
    ConsumerUmbrellaAttachRequest:
      additionalProperties: false
      oneOf:
        - required:
            - type
            - filename
            - content
        - required:
            - attachments
      properties:
        attachments:
          description: Upload multiple declarations in one call when both files are already available.
          items:
            additionalProperties: false
            properties:
              content:
                description: Base64-encoded file bytes.
                type: string
              filename:
                type: string
              type:
                enum:
                  - declarations
                  - auto_declarations
                type: string
            required:
              - type
              - filename
              - content
            type: object
          minItems: 1
          type: array
        content:
          description: Base64-encoded file bytes.
          type: string
        filename:
          type: string
        type:
          enum:
            - declarations
            - auto_declarations
          type: string
      type: object
    ConsumerHomeownersPrefillRequest:
      additionalProperties: false
      properties:
        credit_consent_pending:
          const: true
          description: Must be true. Signals that the user has not yet been shown the review page. Homeowners handoffs collect consent for a soft credit check on that review turn; umbrella handoffs defer credit consent until the user chooses an offer at `select`.
          type: boolean
        field_estimates:
          description: Optional estimate metadata for values that are defensible but not yet directly confirmed by the user. On the initial consumer umbrella handoff, prefer sending only `intake`; add top-level `field_estimates` only when you are certain each `field` already matches a current umbrella review field path.
          items:
            additionalProperties: true
            type: object
          type: array
        intake:
          additionalProperties: true
          description: Fullest currently known consumer homeowners application patch assembled from the user's own context before any piecemeal follow-up. The first create call must already identify whether the property is standard homeowners, condo, or landlord coverage.
          properties:
            home:
              description: Initial product-selection row for the first create call. Send a single object or an array, and make sure the first home row already distinguishes standard homeowners, condo, or landlord coverage.
              oneOf:
                - $ref: '#/components/schemas/ConsumerHomeownersInitialHome'
                - items:
                    $ref: '#/components/schemas/ConsumerHomeownersInitialHome'
                  minItems: 1
                  type: array
          required:
            - home
          type: object
      required:
        - intake
        - credit_consent_pending
      type: object
    OfferSnapshot:
      properties:
        annual_price:
          type: integer
        carrier:
          type: string
        coverage_limit:
          type: string
        is_estimate:
          type: boolean
        price_range:
          properties:
            high:
              type: integer
            low:
              type: integer
          type:
            - object
            - 'null'
      type: object
    HomeownersMissingField:
      properties:
        description:
          type: string
        enum:
          items: {}
          type: array
        field:
          type: string
        format:
          type: string
        label:
          type: string
        message:
          type: string
        path:
          items:
            type: string
          type: array
        type:
          oneOf:
            - type: string
            - items:
                type: string
              type: array
      type: object
    HomeownersOfferSummary:
      properties:
        address:
          additionalProperties: true
          type: object
        annual_price:
          type: number
        carrier:
          type: string
        coverage_summary:
          type: string
        deductible:
          type: number
        dwelling_coverage:
          description: |
            Coverage A / replacement cost as priced by the carrier. Derived from a Replacement Cost Estimator, not from purchase price or appraised value; do not substitute either of those in operator-side displays.
          type: number
        is_estimate:
          type: boolean
        personal_liability:
          type: number
        policy_subtype:
          type: string
        policy_subtype_display:
          type: string
        property_id:
          description: Stable per operator plus normalized property address; reuse it as a property correlation key, not an intake-row identifier.
          type: string
        quote_number:
          type: string
        recommended:
          type: boolean
      type: object
    ConsumerBindRequest:
      oneOf:
        - $ref: '#/components/schemas/ConsumerUmbrellaBindRequest'
        - $ref: '#/components/schemas/ConsumerHomeownersBindRequest'
    HomeownersDashboardResponse:
      properties:
        filters:
          additionalProperties: true
          type: object
        generated_at:
          type: string
        has_more:
          description: True when another dashboard page is available with the returned next_cursor.
          type: boolean
        next_cursor:
          description: Opaque cursor to request the next dashboard page.
          type: string
        operator_uid:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/HomeownersPropertyStatusRow'
          type: array
        property_count:
          type: integer
        status_counts:
          additionalProperties: true
          type: object
      type: object
    ConsumerUmbrellaSelectRequest:
      additionalProperties: false
      properties:
        credit_consent:
          additionalProperties: false
          description: Real-user consent for a soft credit check, collected on the selection turn when Coverage Cat asks for it.
          properties:
            answer:
              description: "The shopper's own answer to Coverage Cat's credit_consent_question."
              enum:
                - 'Yes'
              type: string
            collected_from_user:
              const: true
              description: Attests that the shopper gave this answer directly in the conversation rather than the agent inferring it.
              type: boolean
          required:
            - answer
            - collected_from_user
          type: object
        intake:
          additionalProperties: true
          description: Optional bind-stage answers for the current next_question. Use this when Coverage Cat asked for consent for a soft credit check and bind details in the same shopper-facing turn, so you can retry select with both the consent and the answers together.
          type: object
        selection_confirmed:
          const: true
          type: boolean
        selection_token:
          description: Offer-selection token returned by the quoted umbrella follow-up payload.
          type: string
        um_uim_election:
          description: Optional. Use this when the shopper wants to include or decline the offer's $1M excess UM/UIM option in the same selection reply.
          oneOf:
            - type: boolean
            - enum:
                - include
                - decline
              type: string
            - additionalProperties: false
              properties:
                elected:
                  type: boolean
              required:
                - elected
              type: object
      required:
        - selection_token
        - selection_confirmed
      type: object
    HomeownersPropertyStatusRow:
      properties:
        field_estimates:
          description: |
            Field-level estimates Coverage Cat filled for this property. See `HomeownersFieldEstimate` for handling rules. Estimated values keep quoting moving, but unconfirmed estimated home fields must still be reviewed in the homeowner portal before final bind.
          items:
            $ref: '#/components/schemas/HomeownersFieldEstimate'
          type: array
        fix_issues_email_available:
          description: |
            True when the operator may trigger Coverage Cat to send the homeowner a secure fix-issues email for this request UID.
          type: boolean
        home_index:
          type: integer
        home_ownership:
          type: string
        homeowner_fix_issues_request_login_url:
          description: |
            Shareable homeowner sign-in request page for the fix-issues flow. Use this when the property is still in `needs_more_info` and the homeowner should complete the missing items in Coverage Cat's GUI.
          format: uri
          type: string
        homeowner_quotes_request_login_url:
          description: |
            Shareable homeowner sign-in request page for the offers view. The homeowner still has to request their own login link by email, so this URL does not sign the operator or agent into the homeowner's private quotes page.
          format: uri
          type: string
        inserted_at:
          type: string
        location:
          additionalProperties: true
          type: object
        new_purchase:
          type: boolean
        offers_page_available:
          type: boolean
        offers_published:
          description: True once homeowners offers have been published to the homeowner's portal.
          type: boolean
        property_id:
          description: Stable per operator plus normalized property address; reuse it as a property correlation key, not an intake-row identifier.
          type: string
        property_type:
          type: string
        request_uid:
          type: string
        status:
          enum:
            - needs_more_info
            - pending_quotes
            - quoted
            - quotes_published
          type: string
        status_summary:
          description: Coarse operator-facing summary for the current status, without exact missing-field or offer counts.
          type: string
        submitted_at:
          type: string
        updated_at:
          type: string
      type: object
    ErrorResponse:
      additionalProperties: true
      properties:
        error:
          description: Stable machine-readable error code. Workflow clients should branch mainly on invalid_request, not_found, conflict, rate_limited, stale_token, sandbox_unsupported, and internal_error.
          enum:
            - invalid_request
            - not_found
            - conflict
            - rate_limited
            - idempotency_conflict
            - stale_token
            - sandbox_unsupported
            - credit_consent_required
            - internal_error
            - unauthorized
            - forbidden
            - key_expired
            - too_many_attempts
            - tool_not_found
            - tool_rate_limited
            - unsupported_api_version
            - invalid_email
            - invalid_otp
            - invalid_json
            - request_too_large
            - invalid_request_signature
          type: string
        message:
          description: Human-readable explanation of the failure.
          type: string
      type: object
    BindRequest:
      additionalProperties: false
      properties:
        intake:
          additionalProperties: true
          description: |
            Minimal patch answering only the fields from the current bind-stage `next_question`. Do not send quote-affecting changes here.
          type: object
        sandbox:
          description: |
            Optional sticky sandbox flag. Sandbox delegated umbrella sessions currently reject `bind` with `sandbox_unsupported`; this field is accepted so a client carrying the same request envelope does not fail schema validation first.
          type: boolean
        uid:
          type: string
      required:
        - uid
      type: object
    ToolBatchError:
      properties:
        error:
          type: string
        message:
          type: string
        reason:
          type: string
      type: object
    ConsumerPrefillResponse:
      additionalProperties: false
      properties:
        expires_at:
          description: When the returned consumer handoff credentials expire.
          format: date-time
          type: string
        intake_access_token:
          description: Short-lived direct follow-up bearer for `/api/intake/{uid}`.
          type: string
        polling_token:
          description: Opaque coarse-status polling token for `/api/consumer/status`.
          type: string
        resume_url:
          description: Short-lived browser continuation for the same consumer handoff.
          format: uri
          type: string
        review_summary:
          additionalProperties: false
          description: Current non-authoritative pre-submit checkpoint the agent may summarize before continuing in chat or opening a browser fallback. Unless a later follow-up response shows quote progress, treat this application as not submitted yet. If any shown value is estimated, mark that bullet or value with `*`, include the short note `* = estimated` once above and once below the list, and do not prefix every estimated line with `[Estimated]`.
          properties:
            field_estimates:
              items:
                additionalProperties: true
                description: Coverage Cat estimate provenance metadata for reviewed values.
                type: object
              type: array
            policy:
              additionalProperties: false
              properties:
                cancellation_note:
                  type: string
                cancelled_at:
                  format: date
                  type: string
                carrier:
                  type: string
                confirmation_timestamp:
                  format: date-time
                  type: string
                coverage_summary:
                  additionalProperties: true
                  description: Carrier-confirmed policy coverage details Coverage Cat can safely return.
                  type: object
                effective_date:
                  format: date
                  type: string
                effective_period:
                  additionalProperties: false
                  properties:
                    ends_on:
                      format: date
                      type: string
                    starts_on:
                      format: date
                      type: string
                  type: object
                policy_number:
                  type: string
                state:
                  enum:
                    - bound
                    - cancelled
                  type: string
              type: object
            offer_summary:
              additionalProperties: false
              properties:
                cheapest_annual_premium:
                  type: number
                cheapest_carrier:
                  type: string
                quote_count:
                  type: integer
                recommended_annual_premium:
                  type: number
                recommended_carrier:
                  type: string
              type: object
            pending_fields:
              description: Structured missing-value hints for umbrella pre-submit review.
              items:
                additionalProperties: true
                description: Structured missing-value hints for umbrella pre-submit review.
                type: object
              type: array
            post_choose:
              additionalProperties: true
              description: Structured post-choose state after a quoted umbrella offer is selected.
              type: object
            service_preview:
              additionalProperties: false
              properties:
                action_summary:
                  type: string
                approval_required:
                  type: boolean
                billing_effect:
                  type: string
                carrier_conditions:
                  items:
                    type: string
                  type: array
                coverage_effect:
                  type: string
                details:
                  type: string
                estimated_refund_status:
                  enum:
                    - not_applicable
                    - unknown_pending_review
                  type: string
                reason:
                  type: string
                request_type:
                  enum:
                    - policy_cancellation
                    - refund_request
                    - support_case
                  type: string
                requested_effective_date:
                  format: date
                  type: string
                status:
                  enum:
                    - preview
                  type: string
                uncertainty:
                  type: string
              type: object
            offers:
              items:
                additionalProperties: false
                properties:
                  address:
                    additionalProperties: false
                    properties:
                      city:
                        type: string
                      state:
                        type: string
                      street:
                        type: string
                      zip:
                        type: string
                    type: object
                  annual_price:
                    type: number
                  carrier:
                    type: string
                  coverage_limit:
                    type: string
                  coverage_summary:
                    additionalProperties: true
                    description: Homeowners or umbrella coverage details Coverage Cat can safely summarize.
                    type: object
                  deductible:
                    type: number
                  dwelling_coverage:
                    type: number
                  is_estimate:
                    type: boolean
                  minimum_auto_limits:
                    additionalProperties: true
                    description: Underlying auto-limit requirements for this offer.
                    type: object
                  personal_liability:
                    type: number
                  policy_subtype:
                    type: string
                  policy_subtype_display:
                    type: string
                  price_range:
                    additionalProperties: false
                    properties:
                      high:
                        type: number
                      low:
                        type: number
                    type: object
                  quote_number:
                    type: string
                  recommended:
                    type: boolean
                  sample_policy_url:
                    format: uri
                    type: string
                  selection_guidance:
                    additionalProperties: true
                    description: Offer-specific same-reply requirements and guidance.
                    type: object
                  selection_token:
                    type: string
                  um_uim_selection:
                    additionalProperties: true
                    description: Optional excess UM/UIM election details for this offer.
                    type: object
                type: object
              type: array
            preview_token:
              description: Opaque bind-preview token for the next homeowners bind confirmation.
              type: string
            payment_status:
              additionalProperties: false
              properties:
                channel:
                  type: string
                customer_owned_inbox_required:
                  type: boolean
                destination_hint:
                  type: string
                payment_intent_id:
                  type: string
                payment_method_saved_at:
                  format: date-time
                  type: string
                provider:
                  type: string
                state:
                  type: string
                timing:
                  type: string
              type: object
            review_items:
              items:
                additionalProperties: false
                properties:
                  description:
                    type: string
                  display_value:
                    type: string
                  enum:
                    items:
                      type: string
                    type: array
                  label:
                    type: string
                  number:
                    type: integer
                  path:
                    items:
                      type:
                        - string
                        - integer
                    type: array
                  suggested_value: {}
                type: object
              type: array
            selection_guidance:
              additionalProperties: true
              description: Guidance for completing an offer choice in one shopper-facing reply.
              type: object
            sandbox:
              description: True when Coverage Cat is returning consumer sandbox test data rather than a live shopper workflow.
              type: boolean
            next_question:
              additionalProperties: true
              description: The current shopper-owned question bundle or bind-stage question.
              type: object
            missing_fields:
              description: Structured missing-value hints for homeowners pre-submit review.
              items:
                additionalProperties: true
                description: Structured missing-value hints for homeowners pre-submit review.
                type: object
              type: array
            review:
              additionalProperties: true
              description: Structured review card or selected-offer review block.
              type: object
            uploaded:
              items:
                additionalProperties: false
                properties:
                  filename:
                    type: string
                  type:
                    type: string
                type: object
              type: array
            application_submitted:
              type: boolean
            next_action:
              additionalProperties: true
              description: A structured hint for the next allowed tool or endpoint action.
              type: object
            credit_consent_question:
              type: string
            notification_channel:
              additionalProperties: false
              properties:
                customer_owned_inbox_required:
                  type: boolean
                destination_hint:
                  type: string
                events:
                  items:
                    type: string
                  type: array
                registered:
                  type: boolean
                role:
                  type: string
                type:
                  type: string
              type: object
            review_estimates:
              items:
                additionalProperties: true
                description: Coverage Cat estimate provenance metadata for reviewed values.
                type: object
              type: array
            payment_collection_supported:
              type: boolean
            service_requests:
              items:
                additionalProperties: false
                properties:
                  action_summary:
                    type: string
                  billing_effect:
                    type: string
                  carrier_conditions:
                    items:
                      type: string
                    type: array
                  coverage_effect:
                    type: string
                  details:
                    type: string
                  estimated_refund_status:
                    enum:
                      - not_applicable
                      - unknown_pending_review
                    type: string
                  final_outcome:
                    additionalProperties: true
                    description: Final carrier or billing outcome once Coverage Cat can confirm it.
                    type: object
                  reason:
                    type: string
                  request_id:
                    type: string
                  request_type:
                    enum:
                      - policy_cancellation
                      - refund_request
                      - support_case
                    type: string
                  requested_at:
                    format: date-time
                    type: string
                  requested_effective_date:
                    format: date
                    type: string
                  status:
                    enum:
                      - pending_review
                      - completed
                    type: string
                  uncertainty:
                    type: string
                type: object
              type: array
            offers_url:
              description: Coverage Cat browser URL for the selected offer or offer-tracking page.
              format: uri
              type: string
            conversation:
              additionalProperties: false
              properties:
                messages:
                  items:
                    additionalProperties: false
                    properties:
                      author_label:
                        type: string
                      delivery_state:
                        enum:
                          - received
                          - queued
                          - sent
                        type: string
                      direction:
                        enum:
                          - incoming
                          - outgoing
                        type: string
                      medium:
                        enum:
                          - email
                          - app
                          - sms
                        type: string
                      message_id:
                        type: integer
                      subject:
                        type: string
                      text:
                        type: string
                      timestamp:
                        format: date-time
                        type: string
                    type: object
                  type: array
                reply_pending:
                  type: boolean
                reply_supported:
                  type: boolean
                reply_to_message_id:
                  type: integer
                reply_via:
                  type: string
              type: object
            service_request:
              additionalProperties: false
              properties:
                action_summary:
                  type: string
                billing_effect:
                  type: string
                carrier_conditions:
                  items:
                    type: string
                  type: array
                coverage_effect:
                  type: string
                details:
                  type: string
                estimated_refund_status:
                  enum:
                    - not_applicable
                    - unknown_pending_review
                  type: string
                final_outcome:
                  additionalProperties: true
                  description: Final carrier or billing outcome once Coverage Cat can confirm it.
                  type: object
                reason:
                  type: string
                request_id:
                  type: string
                request_type:
                  enum:
                    - policy_cancellation
                    - refund_request
                    - support_case
                  type: string
                requested_at:
                  format: date-time
                  type: string
                requested_effective_date:
                  format: date
                  type: string
                status:
                  enum:
                    - pending_review
                    - completed
                  type: string
                uncertainty:
                  type: string
              type: object
            purchase_preview:
              additionalProperties: false
              properties:
                action_summary:
                  type: string
                approval_required:
                  type: boolean
                carrier_conditions:
                  items:
                    type: string
                  type: array
                coverage_summary:
                  additionalProperties: true
                  description: Coverage details tied to the current previewed offer.
                  type: object
                effective_date:
                  format: date
                  type: string
                effective_period:
                  additionalProperties: false
                  properties:
                    ends_on:
                      format: date
                      type: string
                    starts_on:
                      format: date
                      type: string
                  type: object
                payment_timing:
                  type: string
                price:
                  additionalProperties: false
                  properties:
                    annual_premium:
                      type: number
                    currency:
                      type: string
                    payment_method:
                      type: string
                  type: object
                status:
                  type: string
                uncertainty:
                  type: string
              type: object
            support:
              additionalProperties: false
              properties:
                contact_url:
                  description: Coverage Cat support route for billing, cancellations, and quote follow-up.
                  format: uri
                  type: string
                email:
                  type: string
                phone:
                  type: string
              type: object
            selected_offer:
              additionalProperties: false
              properties:
                address:
                  additionalProperties: false
                  properties:
                    city:
                      type: string
                    state:
                      type: string
                    street:
                      type: string
                    zip:
                      type: string
                  type: object
                annual_price:
                  type: number
                carrier:
                  type: string
                coverage_limit:
                  type: string
                coverage_summary:
                  additionalProperties: true
                  description: Homeowners or umbrella coverage details Coverage Cat can safely summarize.
                  type: object
                deductible:
                  type: number
                dwelling_coverage:
                  type: number
                is_estimate:
                  type: boolean
                minimum_auto_limits:
                  additionalProperties: true
                  description: Underlying auto-limit requirements for this offer.
                  type: object
                personal_liability:
                  type: number
                policy_subtype:
                  type: string
                policy_subtype_display:
                  type: string
                price_range:
                  additionalProperties: false
