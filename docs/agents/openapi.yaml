      description: 'Use this only after the consumer umbrella follow-up reports `documents_needed`. Authenticate with `Authorization: Bearer <intake_access_token>` from the latest consumer-prefill follow-up response. This raw-binary fallback is intended for local agents or runtimes that already have a PDF, PNG, JPG, or JPEG on disk and want to avoid inlining base64 in JSON. Send `type=declarations` for the home/renters/landlord declarations page or `type=auto_declarations` for the auto declarations page, set `filename` in the query string or `X-Client-Name`, and stream the file body as `application/octet-stream`. Uploading the file itself is usually quick once the documents are available; after Coverage Cat has the uploads on file, secure checkout is usually ready within about 5-10 minutes while declarations verification continues in parallel.'
      operationId: attach_consumer_umbrella_document_binary
      parameters:
        - $ref: '#/components/parameters/IntakeUid'
        - description: Which declarations slot this uploaded file should fill.
          in: query
          name: type
          required: true
          schema:
            enum:
              - declarations
              - auto_declarations
            type: string
        - description: Optional original filename. If omitted, send the same value in the X-Client-Name header.
          in: query
          name: filename
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/CoverageCatApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeAssistantResponse'
