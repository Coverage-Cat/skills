  /api/agent/umbrella/select:
    post:
      description: |
        Pass the selected `selection_token`, `selection_confirmed: true`, and the `credit_consent` block collected from the real user. Coverage Cat requires the affirmative Yes to the consumer-report authorization before binding a chosen offer; if it is missing or declined the response is `credit_consent_required` with the complete disclosure to render. A selected Monoline offer also requires a separate `monoline_mvr_consent`: show the complete returned carrier-specific disclosure and its source URL, collect the shopper's separate answer, and send both receipts in the same retry. If a consent-required response also returns `next_question`, collect those details in the same shopper turn and send them under `intake`. Send `um_uim_election` when the chosen offer exposes that option. Otherwise Coverage Cat will either return the next bind-stage question or continue the standard post-choose workflow and tell the agent to keep polling `status` in chat. For Monoline and Markel, the post-choose workflow may require declarations uploads first; once those uploads are on file, `documents_pending_review` usually advances to `payment_needed` with a secure `payment_url` within about 5-10 minutes while declarations verification continues in parallel. Successful post-choose responses include `offers_url`, and may include `required_upload_types` or a secure `payment_url`. Sandbox delegated umbrella sessions reject this endpoint with `sandbox_unsupported`.

