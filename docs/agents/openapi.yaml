  /api/agent/umbrella/attach:
    post:
      description: |
        Accepts a base64-encoded document (PDF or image) and attaches it to the intake as a declarations page. Use type "declarations" for a home/renters declarations page and "auto_declarations" for an auto declarations page. If both the home and auto declarations are already available, prefer one attach call with `attachments[]` so the shopper only has to approve one upload turn. Call this only after the user has selected a Monoline or Markel offer and the delegated session is in bind or post-select checkout. Sandbox delegated umbrella sessions reject this endpoint with `sandbox_unsupported`.
      operationId: attach_document_to_umbrella_session
      parameters:
        - $ref: '#/components/parameters/CoverageCatApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              oneOf:
                - required:
                    - uid
                    - content
                    - filename
                    - type
                - required:
                    - uid
                    - attachments
              properties:
                attachments:
                  description: Upload multiple declarations in one call when both files are already available.
                  items:
                    additionalProperties: false
                    properties:
                      content:
                        description: Base64-encoded file content (PDF or image).
                        format: byte
                        type: string
                      filename:
                        description: Original filename including extension (e.g. "home_dec.pdf").
                        type: string
                      type:
                        description: |
                          "declarations" for a home or renters dec page; "auto_declarations" for an auto dec page.
                        enum:
                          - declarations
                          - auto_declarations
                        type: string
                    required:
                      - type
                      - filename
                      - content
                    type: object
                  minItems: 1
