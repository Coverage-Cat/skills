        confidence:
          description: |
            Coverage Cat's internal confidence, not carrier acceptance risk. Prioritize confirming `low` confidence estimates with the customer before binding.
          enum:
            - low
            - medium
            - high
          type: string
        confirmed_by_user:
          description: |
            Whether a human has re-sent this field as a confirmed answer on a subsequent update, whether from the delegated operator payload or the homeowner reviewing the pre-filled value in Coverage Cat's portal.
          type: boolean
        estimated_at:
          format: date-time
          type: string
        field:
          description: Dot-path of the field on the intake (e.g. `property_type`).
          type: string
        source:
          description: |
            Opaque provenance label for the estimate. Common operator-side labels include `crm`, `email_thread`, `policy_declarations`, and `prior_coverage_cat_session`; Coverage Cat-generated labels include `loan_file`, `zillow`, `realtor`, `vintage_rule`, and `zdr_openai`. Treat unknown values as opaque; new sources may be added over time.
          type: string
        value:
          description: Estimated value. Type matches the underlying intake field.
      type: object
    ToolBatchResponse:
      properties:
        error_count:
          type: integer
        operation_count:
          type: integer
        results:
          items:
            $ref: '#/components/schemas/ToolBatchResult'
          type: array
        success_count:
          type: integer
      type: object
    FallbackStep:
      properties:
        display_note:
          type: string
        type:
          enum:
            - dashboard
          type: string
        url:
          format: uri
          type: string
      type: object
  securitySchemes:
    agent_api_key:
      scheme: bearer
      type: http
    intake_access_token:
      description: Short-lived bearer token returned by consumer-prefill and rotated by each successful direct follow-up response.
      scheme: bearer
      type: http
info:
  description: |-
    Which surface do you want? This document is the full contract and includes the delegated `/api/agent/*` endpoints, which require an operator-issued API key that Coverage Cat grants only to businesses transacting on behalf of their own customers. If you are a personal AI assistant shopping for your own human user, use `/api/consumer/openapi.yaml` instead: the consumer purchase flow for umbrella and homeowners needs no Coverage Cat credential, and you should never ask the shopper for one. The `x-coverage-cat-surface` extension on each operation below marks which surface it belongs to.

    Delegated-agent APIs for Coverage Cat purchase workflows and read-only insurance tools. Umbrella delegated purchase is a one-review-page flow: the operator-side agent fills the application from allowed context, Coverage Cat returns estimated-field metadata, and the human only reviews or corrects the final JSON before preliminary quotes are generated. Credit consent is collected after the user chooses an offer, at the `select` step, before Coverage Cat can bind. Homeowners delegated purchase is a near-single-endpoint operator flow: gather the fullest approved-context application first, mark non-user- confirmed home values with `field_estimates`, treat `credit_check_authorized` as the real homeowner's explicit authorization for Coverage Cat's soft credit pull on the assembled application, allow a first complete create call to include it when the operator already collected that exact consent separately, otherwise hold it back until review, then let Coverage Cat submit and quote the intake asynchronously and route the homeowner back through portal review for any remaining estimated home answers before final bind. Coverage Cat also exposes public consumer handoff endpoints at `/api/consumer/umbrella/prefill`, `/api/consumer/homeowners/prefill`, `/api/consumer/status`, and the direct follow-up intake endpoints under `/api/intake/{uid}`. On the direct follow-up path, authenticate with the latest rotated `intake_access_token`, use `PATCH /api/intake/{uid}` only for pre-submit review, correction, and submission, and continue umbrella post-choose follow-up through `/api/intake/{uid}/select`, `/api/intake/{uid}/bind`, and `/api/intake/{uid}/attach`.

    Versioning: send the optional `Coverage-Cat-API-Version: v1` header to pin the stable agent API contract explicitly.

    Coverage Cat keeps `v1` as the current stable agent API version by default. If a future version supersedes it, Coverage Cat will announce the change in the developer portal and emit `Deprecation` and `Sunset` headers on the retiring version for at least 90 days before removal.

    Coverage Cat also echoes `X-Skill-Version: 1.0.0` so clients can log which published runtime-contract version served the response.

    Authenticated write operations also accept an `Idempotency-Key` header. Coverage Cat replays the cached successful response for the same operator, path, and key for 24 hours.

    Public consumer handoff endpoints live at `/api/consumer/umbrella/prefill`, `/api/consumer/homeowners/prefill`, `/api/consumer/status`, and the direct follow-up intake endpoints under `/api/intake/{uid}`.

    Rate-limited endpoints return `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`, and `RateLimit-Policy`. A `429` response also includes `Retry-After`.
  title: Coverage Cat Delegated Insurance Purchase APIs
  version: 1.0.0
  x-coverage-cat-consumer-openapi: /api/consumer/openapi.yaml
  x-coverage-cat-surface: full
  x-skill-version: 1.0.0
