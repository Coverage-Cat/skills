      type: http
info:
  description: |-
    Delegated-agent APIs for Coverage Cat purchase workflows and read-only insurance tools. Umbrella delegated purchase is a one-review-page flow: the operator-side agent fills the application from allowed context, Coverage Cat returns estimated-field metadata, and the human only reviews or corrects the final JSON before preliminary quotes are generated. Credit consent is collected after the user chooses an offer, at the `select` step, before Coverage Cat can bind. Homeowners delegated purchase is a near-single-endpoint operator flow: gather the fullest approved-context application first, mark non-user- confirmed home values with `field_estimates`, hold back `credit_check_authorized` until the real homeowner has reviewed the assembled application and explicitly consented to a soft credit pull, then let Coverage Cat submit and quote the intake asynchronously and route the homeowner back through portal review for any remaining estimated home answers before final bind. Coverage Cat also exposes public consumer handoff endpoints at `/api/consumer/umbrella/prefill`, `/api/consumer/homeowners/prefill`, `/api/consumer/status`, and the direct follow-up intake endpoints under `/api/intake/{uid}`. On the direct follow-up path, authenticate with the latest rotated `intake_access_token`, use `PATCH /api/intake/{uid}` only for pre-submit review, correction, and submission, and continue umbrella post-choose follow-up through `/api/intake/{uid}/select`, `/api/intake/{uid}/bind`, and `/api/intake/{uid}/attach`.

    Versioning: send the optional `Coverage-Cat-API-Version: v1` header to pin the stable agent API contract explicitly.

    Coverage Cat keeps `v1` as the current stable agent API version by default. If a future version supersedes it, Coverage Cat will announce the change in the developer portal and emit `Deprecation` and `Sunset` headers on the retiring version for at least 90 days before removal.

    Coverage Cat also echoes `X-Skill-Version: 1.0.0` so clients can log which published runtime-contract version served the response.

    Authenticated write operations also accept an `Idempotency-Key` header. Coverage Cat replays the cached successful response for the same operator, path, and key for 24 hours.

    Public consumer handoff endpoints live at `/api/consumer/umbrella/prefill`, `/api/consumer/homeowners/prefill`, `/api/consumer/status`, and the direct follow-up intake endpoints under `/api/intake/{uid}`.

    Rate-limited endpoints return `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`, and `RateLimit-Policy`. A `429` response also includes `Retry-After`.
  title: Coverage Cat Delegated Insurance Purchase APIs
  version: 1.0.0
  x-skill-version: 1.0.0
openapi: 3.1.0
paths:
