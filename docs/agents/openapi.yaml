---
components:
  headers:
    CoverageCatApiVersion:
      description: The Coverage Cat agent API version used to serve this response.
      schema:
        enum:
          - v1
        type: string
    Location:
      description: Absolute URL where the async delegated-homeowners job can be polled safely.
      schema:
        format: uri
        type: string
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
    RateLimitPolicy:
      description: Human-readable rate-limit policy for the current bucket.
      schema:
        type: string
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current rate-limit window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying a rate-limited request.
      schema:
        type: integer
    SkillVersion:
      description: Published Coverage Cat runtime-contract version for this response surface.
      schema:
        example: 1.0.0
        type: string
  parameters:
    CoverageCatApiVersion:
      description: Optional explicit Coverage Cat API version selector. Omit the header to use the current stable version.
      in: header
      name: Coverage-Cat-API-Version
      required: false
      schema:
        default: v1
        enum:
          - v1
        type: string
    DashboardCursor:
      description: Opaque cursor returned by a prior homeowners dashboard response.
      in: query
      name: cursor
      required: false
      schema:
        type: string
    IdempotencyKey:
      description: Optional idempotency key for consumer or operator write requests. Coverage Cat replays the cached successful response for the same subject, path, and key for 24 hours, and rejects a changed payload under the same key.
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
    IntakeUid:
      description: Coverage Cat intake uid returned by the consumer-prefill or intake creation step.
      in: path
      name: uid
      required: true
      schema:
        type: string
  schemas:
    AutoCalculatorRequest:
      additionalProperties: true
      properties:
        coverage:
          properties:
            collision_deductible:
              default: 1000
              type: integer
            comprehensive_deductible:
              default: 1000
              type: integer
          type: object
        driver:
          properties:
            age:
              default: 35
              type: integer
            gender:
              default: 'N'
              type: string
            state:
              default: CA
              type: string
            zip:
              type: string
          type: object
        repair_estimate:
          description: Used by the file-a-claim calculator.
          type: integer
        vehicle:
          properties:
            make:
              type: string
            model:
              type: string
            style:
              type: string
            submodel:
              type: string
            year:
              type: integer
          type: object
      type: object
    ConsumerStatusResponse:
      properties:
        detail_status:
          type: string
        line:
          enum:
            - umbrella
            - homeowners
          type: string
        offer_summary:
          $ref: '#/components/schemas/ConsumerOfferSummary'
        response_summary:
          type: string
        sandbox:
          type: boolean
        status:
          enum:
            - in_review
            - review_pending
            - credit_consent_pending
            - quoted
            - bound
            - abandoned
          type: string
      type: object
    ConsumerUmbrellaAttachRequest:
      additionalProperties: false
      oneOf:
        - required:
            - type
            - filename
            - content
        - required:
            - attachments
      properties:
        attachments:
          description: Upload multiple declarations in one call when both files are already available.
          items:
            additionalProperties: false
            properties:
              content:
                description: Base64-encoded file bytes.
                type: string
              filename:
                type: string
              type:
                enum:
                  - declarations
                  - auto_declarations
                type: string
            required:
              - type
              - filename
              - content
            type: object
          minItems: 1
          type: array
        content:
          description: Base64-encoded file bytes.
          type: string
        filename:
          type: string
        type:
          enum:
            - declarations
            - auto_declarations
          type: string
      type: object
    OfferSnapshot:
      properties:
        annual_price:
          type: integer
        carrier:
          type: string
        coverage_limit:
          type: string
        is_estimate:
          type: boolean
        price_range:
          properties:
            high:
              type: integer
            low:
              type: integer
          type:
            - object
            - 'null'
      type: object
    ConsumerBindRequest:
      oneOf:
        - $ref: '#/components/schemas/ConsumerUmbrellaBindRequest'
    ConsentDisclosure:
      additionalProperties: false
      properties:
        kind:
          type: string
        source_updated_at:
          description: Displayed update date for a carrier-specific source disclosure, when present.
          format: date
          type: string
        source_url:
          description: Carrier disclosure source URL that must be shown with carrier-specific text, when present.
          format: uri
          type: string
        text:
          description: Complete disclosure text that must be presented verbatim before the shopper answers.
          type: string
        text_hash:
          description: Hash to copy into credit_consent.disclosure_hash.
          type: string
        version:
          description: Version to copy into credit_consent.disclosure_version.
          type: string
      required:
        - kind
        - version
        - text
        - text_hash
      type: object
    CreditConsentReceipt:
      additionalProperties: false
      description: Versioned real-user consent receipt. Display the complete returned credit_consent_disclosure.text verbatim before collecting the answer, and record the actual current presentation time; a raw authorization boolean is not evidence.
      properties:
        answer:
          description: The shopper's own answer after the complete returned disclosure was shown.
          enum:
            - 'Yes'
            - 'No'
            - Revoke
          type: string
        collected_from_user:
          const: true
          description: Attests that the shopper personally answered rather than the agent assuming consent.
          type: boolean
        disclosure_hash:
          description: Exact text_hash from the returned credit_consent_disclosure.
          type: string
        disclosure_version:
          description: Exact version from the returned credit_consent_disclosure.
          type: string
        presentation_reference:
          description: Optional opaque conversation or message reference; do not include message contents or personal information.
          maxLength: 200
          type: string
        presented_at:
          description: RFC 3339 timestamp from the assistant runtime for when the complete disclosure was shown. Use the actual current presentation time; Coverage Cat accepts a timestamp within the prior 24 hours and no more than five minutes in the future.
          format: date-time
          type: string
        shown_to_user:
          const: true
          description: Attests that the complete returned disclosure text was presented verbatim before the shopper answered.
          type: boolean
      required:
        - answer
        - collected_from_user
        - shown_to_user
        - disclosure_version
        - disclosure_hash
        - presented_at
      type: object
    MonolineMvrConsentReceipt:
      additionalProperties: false
      description: Versioned real-user response to the selected Monoline offer's MVR and consumer-report authorization. Display the complete returned monoline_mvr_consent_disclosure.text and source_url before collecting the answer.
      properties:
        answer:
          description: The shopper's own answer after the complete carrier-specific disclosure and source URL were shown.
          enum:
            - 'Yes'
            - 'No'
            - Revoke
          type: string
        collected_from_user:
          const: true
          description: Attests that the shopper personally answered rather than the agent assuming consent.
          type: boolean
        disclosure_hash:
          description: Exact text_hash from the returned monoline_mvr_consent_disclosure.
          type: string
        disclosure_version:
          description: Exact version from the returned monoline_mvr_consent_disclosure.
          type: string
        presentation_reference:
          description: Optional opaque conversation or message reference; do not include message contents or personal information.
          maxLength: 200
          type: string
        presented_at:
          description: RFC 3339 timestamp from the assistant runtime for when the complete disclosure and source URL were shown.
          format: date-time
          type: string
        shown_to_user:
          const: true
          description: Attests that the complete returned disclosure text and source URL were presented before the shopper answered.
          type: boolean
      required:
        - answer
        - collected_from_user
        - shown_to_user
        - disclosure_version
        - disclosure_hash
        - presented_at
      type: object
    ConsumerUmbrellaSelectRequest:
      additionalProperties: false
      properties:
        credit_consent:
          $ref: '#/components/schemas/CreditConsentReceipt'
        intake:
          additionalProperties: true
          description: Optional bind-stage answers for the current next_question. Use this when Coverage Cat asked for consumer-report authorization and bind details in the same shopper-facing turn, so you can retry select with both the consent and the answers together.
          type: object
        monoline_mvr_consent:
          $ref: '#/components/schemas/MonolineMvrConsentReceipt'
        selection_confirmed:
          const: true
          type: boolean
        selection_token:
          description: Offer-selection token returned by the quoted umbrella follow-up payload.
          type: string
        um_uim_election:
          description: Optional. Use this when the shopper wants to include or decline the offer's $1M excess UM/UIM option in the same selection reply.
          oneOf:
            - type: boolean
            - enum:
                - include
                - decline
              type: string
            - additionalProperties: false
              properties:
                elected:
                  type: boolean
              required:
                - elected
              type: object
      required:
        - selection_token
        - selection_confirmed
      type: object
    ErrorResponse:
      additionalProperties: true
      properties:
        error:
          description: Stable machine-readable error code. Workflow clients should branch mainly on invalid_request, not_found, conflict, rate_limited, stale_token, sandbox_unsupported, and internal_error.
          enum:
            - invalid_request
            - not_found
            - conflict
            - rate_limited
            - idempotency_conflict
            - stale_token
            - sandbox_unsupported
            - credit_consent_required
            - internal_error
            - unauthorized
            - forbidden
            - key_expired
            - too_many_attempts
            - tool_not_found
            - tool_rate_limited
            - unsupported_api_version
            - invalid_email
            - invalid_otp
            - invalid_json
            - request_too_large
            - invalid_request_signature
          type: string
        message:
          description: Human-readable explanation of the failure.
          type: string
      type: object
    BindRequest:
      additionalProperties: false
      properties:
        intake:
          additionalProperties: true
          description: |
            Minimal patch answering only the fields from the current bind-stage `next_question`. Do not send quote-affecting changes here.
          type: object
        sandbox:
          description: |
            Optional sticky sandbox flag. Sandbox delegated umbrella sessions currently reject `bind` with `sandbox_unsupported`; this field is accepted so a client carrying the same request envelope does not fail schema validation first.
          type: boolean
        uid:
          type: string
      required:
        - uid
      type: object
    ToolBatchError:
      properties:
        error:
          type: string
        message:
          type: string
        reason:
          type: string
      type: object
    ConsumerPrefillResponse:
      additionalProperties: false
      properties:
        credit_consent_disclosure:
          $ref: '#/components/schemas/ConsentDisclosure'
        expires_at:
          description: When the returned consumer handoff credentials expire.
          format: date-time
          type: string
        intake_access_token:
          description: Short-lived direct follow-up bearer for `/api/intake/{uid}`.
          type: string
        polling_token:
          description: Opaque coarse-status polling token for `/api/consumer/status`.
          type: string
        resume_url:
          description: Short-lived browser continuation for the same consumer handoff.
          format: uri
          type: string
        review_summary:
          additionalProperties: false
          description: Current non-authoritative pre-submit checkpoint the agent may summarize before continuing in chat or opening a browser fallback. Unless a later follow-up response shows quote progress, treat this application as not submitted yet. If any shown value is estimated, mark that bullet or value with `*`, include the short note `* = estimated` once above and once below the list, and do not prefix every estimated line with `[Estimated]`.
          properties:
            field_estimates:
              items:
                additionalProperties: true
                description: Coverage Cat estimate provenance metadata for reviewed values.
                type: object
              type: array
            policy:
              additionalProperties: false
              properties:
                cancellation_note:
                  type: string
                cancelled_at:
                  format: date
                  type: string
                carrier:
                  type: string
                confirmation_timestamp:
                  format: date-time
                  type: string
                coverage_summary:
                  additionalProperties: true
                  description: Carrier-confirmed policy coverage details Coverage Cat can safely return.
                  type: object
                effective_date:
                  format: date
                  type: string
                effective_period:
                  additionalProperties: false
                  properties:
                    ends_on:
                      format: date
                      type: string
                    starts_on:
                      format: date
                      type: string
                  type: object
                policy_number:
                  type: string
                state:
                  enum:
                    - bound
                    - cancelled
                  type: string
              type: object
            offer_summary:
              additionalProperties: false
              properties:
                cheapest_annual_premium:
                  type: number
                cheapest_carrier:
                  type: string
                quote_count:
                  type: integer
                recommended_annual_premium:
                  type: number
                recommended_carrier:
                  type: string
              type: object
            pending_fields:
              description: Structured missing-value hints for umbrella pre-submit review.
              items:
                additionalProperties: true
                description: Structured missing-value hints for umbrella pre-submit review.
                type: object
              type: array
            post_choose:
              additionalProperties: true
              description: Structured post-choose state after a quoted umbrella offer is selected.
              type: object
            service_preview:
              additionalProperties: false
              properties:
                action_summary:
                  type: string
                approval_required:
                  type: boolean
                billing_effect:
                  type: string
                carrier_conditions:
                  items:
                    type: string
                  type: array
                coverage_effect:
                  type: string
                details:
                  type: string
                estimated_refund_status:
                  enum:
                    - not_applicable
                    - unknown_pending_review
                  type: string
                reason:
                  type: string
                request_type:
                  enum:
                    - policy_cancellation
                    - refund_request
                    - support_case
                  type: string
                requested_effective_date:
                  format: date
                  type: string
                status:
                  enum:
                    - preview
                  type: string
                uncertainty:
                  type: string
              type: object
            offers:
              items:
                additionalProperties: false
                properties:
                  address:
                    additionalProperties: false
                    properties:
                      city:
                        type: string
                      state:
                        type: string
                      street:
                        type: string
                      zip:
                        type: string
                    type: object
                  annual_price:
                    type: number
                  carrier:
                    type: string
                  coverage_limit:
                    type: string
                  coverage_summary:
                    additionalProperties: true
                    description: Homeowners or umbrella coverage details Coverage Cat can safely summarize.
                    type: object
                  deductible:
                    type: number
                  dwelling_coverage:
                    type: number
                  is_estimate:
                    type: boolean
                  minimum_auto_limits:
                    additionalProperties: true
                    description: Underlying auto-limit requirements for this offer.
                    type: object
                  personal_liability:
                    type: number
                  policy_subtype:
                    type: string
                  policy_subtype_display:
                    type: string
                  price_range:
                    additionalProperties: false
                    properties:
                      high:
                        type: number
                      low:
                        type: number
                    type: object
                  quote_number:
                    type: string
                  recommended:
                    type: boolean
                  sample_policy_url:
                    format: uri
                    type: string
                  selection_guidance:
                    additionalProperties: true
                    description: Offer-specific same-reply requirements and guidance.
                    type: object
                  selection_token:
                    type: string
                  um_uim_selection:
                    additionalProperties: true
                    description: Optional excess UM/UIM election details for this offer.
                    type: object
                type: object
              type: array
            preview_token:
              description: Opaque bind-preview token for the next homeowners bind confirmation.
              type: string
            payment_status:
              additionalProperties: false
              properties:
                channel:
                  type: string
                customer_owned_inbox_required:
                  type: boolean
                destination_hint:
                  type: string
                payment_intent_id:
                  type: string
                payment_method_saved_at:
                  format: date-time
                  type: string
                provider:
                  type: string
                state:
                  type: string
                timing:
                  type: string
              type: object
            review_items:
              items:
                additionalProperties: false
                properties:
                  description:
                    type: string
                  display_value:
                    type: string
                  enum:
                    items:
                      type: string
                    type: array
                  label:
                    type: string
                  number:
                    type: integer
                  path:
                    items:
                      type:
                        - string
                        - integer
                    type: array
                  suggested_value: {}
                type: object
              type: array
            selection_guidance:
              additionalProperties: true
              description: Guidance for completing an offer choice in one shopper-facing reply.
              type: object
            sandbox:
              description: True when Coverage Cat is returning consumer sandbox test data rather than a live shopper workflow.
              type: boolean
            next_question:
              additionalProperties: true
              description: The current shopper-owned question bundle or bind-stage question.
              type: object
            missing_fields:
              description: Structured missing-value hints for homeowners pre-submit review.
              items:
                additionalProperties: true
                description: Structured missing-value hints for homeowners pre-submit review.
                type: object
              type: array
            review:
              additionalProperties: true
              description: Structured review card or selected-offer review block.
              type: object
            uploaded:
              items:
                additionalProperties: false
                properties:
                  filename:
                    type: string
                  type:
                    type: string
                type: object
              type: array
            application_submitted:
              type: boolean
            next_action:
              additionalProperties: true
              description: A structured hint for the next allowed tool or endpoint action.
              type: object
            credit_consent_disclosure:
              $ref: '#/components/schemas/ConsentDisclosure'
            credit_consent_question:
              description: Short compatibility prompt. Display the complete credit_consent_disclosure.text verbatim and return the complete versioned receipt rather than relying on this prompt alone.
              type: string
            notification_channel:
              additionalProperties: false
              properties:
                customer_owned_inbox_required:
                  type: boolean
                destination_hint:
                  type: string
                events:
                  items:
                    type: string
                  type: array
                registered:
                  type: boolean
                role:
                  type: string
                type:
                  type: string
              type: object
            review_estimates:
              items:
                additionalProperties: true
                description: Coverage Cat estimate provenance metadata for reviewed values.
                type: object
              type: array
            payment_collection_supported:
              type: boolean
            service_requests:
              items:
                additionalProperties: false
                properties:
                  action_summary:
                    type: string
                  billing_effect:
                    type: string
                  carrier_conditions:
                    items:
                      type: string
                    type: array
                  coverage_effect:
                    type: string
                  details:
                    type: string
                  estimated_refund_status:
                    enum:
                      - not_applicable
                      - unknown_pending_review
                    type: string
                  final_outcome:
                    additionalProperties: true
                    description: Final carrier or billing outcome once Coverage Cat can confirm it.
                    type: object
                  reason:
                    type: string
                  request_id:
                    type: string
                  request_type:
                    enum:
                      - policy_cancellation
                      - refund_request
                      - support_case
                    type: string
                  requested_at:
                    format: date-time
                    type: string
                  requested_effective_date:
                    format: date
                    type: string
                  status:
                    enum:
                      - pending_review
                      - completed
                    type: string
                  uncertainty:
                    type: string
                type: object
              type: array
            offers_url:
              description: Coverage Cat browser URL for the selected offer or offer-tracking page.
              format: uri
              type: string
            conversation:
              additionalProperties: false
              properties:
                messages:
                  items:
                    additionalProperties: false
                    properties:
                      author_label:
                        type: string
                      delivery_state:
                        enum:
                          - received
                          - queued
                          - sent
                        type: string
                      direction:
                        enum:
                          - incoming
                          - outgoing
                        type: string
                      medium:
                        enum:
                          - email
                          - app
                          - sms
                        type: string
                      message_id:
                        type: integer
                      subject:
                        type: string
                      text:
                        type: string
                      timestamp:
                        format: date-time
                        type: string
                    type: object
                  type: array
                reply_pending:
                  type: boolean
                reply_supported:
                  type: boolean
                reply_to_message_id:
                  type: integer
                reply_via:
                  type: string
              type: object
            service_request:
              additionalProperties: false
              properties:
                action_summary:
                  type: string
                billing_effect:
                  type: string
                carrier_conditions:
                  items:
                    type: string
                  type: array
                coverage_effect:
                  type: string
                details:
                  type: string
                estimated_refund_status:
                  enum:
                    - not_applicable
                    - unknown_pending_review
                  type: string
                final_outcome:
                  additionalProperties: true
                  description: Final carrier or billing outcome once Coverage Cat can confirm it.
                  type: object
                reason:
                  type: string
                request_id:
                  type: string
                request_type:
                  enum:
                    - policy_cancellation
                    - refund_request
                    - support_case
                  type: string
                requested_at:
                  format: date-time
                  type: string
                requested_effective_date:
                  format: date
                  type: string
                status:
                  enum:
                    - pending_review
                    - completed
                  type: string
                uncertainty:
                  type: string
              type: object
            purchase_preview:
              additionalProperties: false
              properties:
                action_summary:
                  type: string
                approval_required:
                  type: boolean
                carrier_conditions:
                  items:
                    type: string
                  type: array
                coverage_summary:
                  additionalProperties: true
                  description: Coverage details tied to the current previewed offer.
                  type: object
                effective_date:
                  format: date
                  type: string
                effective_period:
                  additionalProperties: false
                  properties:
                    ends_on:
                      format: date
                      type: string
                    starts_on:
                      format: date
                      type: string
                  type: object
                payment_timing:
                  type: string
                price:
                  additionalProperties: false
                  properties:
                    annual_premium:
                      type: number
                    currency:
                      type: string
                    payment_method:
                      type: string
                  type: object
                status:
                  type: string
                uncertainty:
                  type: string
              type: object
            support:
              additionalProperties: false
              properties:
                contact_url:
                  description: Coverage Cat support route for billing, cancellations, and quote follow-up.
                  format: uri
                  type: string
                email:
                  type: string
                phone:
                  type: string
              type: object
            selected_offer:
              additionalProperties: false
              properties:
                address:
                  additionalProperties: false
                  properties:
                    city:
                      type: string
                    state:
                      type: string
                    street:
                      type: string
                    zip:
                      type: string
                  type: object
                annual_price:
                  type: number
                carrier:
                  type: string
                coverage_limit:
                  type: string
                coverage_summary:
                  additionalProperties: true
                  description: Homeowners or umbrella coverage details Coverage Cat can safely summarize.
                  type: object
                deductible:
                  type: number
                dwelling_coverage:
                  type: number
                is_estimate:
                  type: boolean
                minimum_auto_limits:
                  additionalProperties: true
                  description: Underlying auto-limit requirements for this offer.
                  type: object
                personal_liability:
                  type: number
                policy_subtype:
                  type: string
                policy_subtype_display:
                  type: string
                price_range:
                  additionalProperties: false
                  properties:
                    high:
                      type: number
                    low:
                      type: number
                  type: object
                quote_number:
                  type: string
                recommended:
                  type: boolean
                sample_policy_url:
                  format: uri
                  type: string
                selection_guidance:
                  additionalProperties: true
                  description: Offer-specific same-reply requirements and guidance.
                  type: object
                selection_token:
                  type: string
                um_uim_selection:
                  additionalProperties: true
                  description: Optional excess UM/UIM election details for this offer.
                  type: object
              type: object
            status:
              enum:
                - abandoned
                - blocked
                - bound
                - cancelled
                - chosen
                - credit_consent_pending
                - credit_consent_required
                - dev_success
                - documents_needed
                - documents_pending_review
                - email_sent
                - in_review
                - ineligible
                - info_requested
                - needs_more_info
                - needs_more_info_to_bind
                - no_policy
                - no_chosen_offer
                - no_quotes
                - no_selection
                - ok
                - payment_collection_ready
                - payment_needed
                - pending
                - pending_quotes
                - queued
                - quote_rate_limited
                - quoted
                - ready_for_review
                - ready_for_submission
                - ready_to_finalize
                - review_pending
                - service_preview
                - service_requested
                - sandbox_unsupported
                - stale_selection
                - verifying_documents
                - waiting_on_carrier
                - waiting_on_documents
                - waiting_on_payment
              type: string
            review_token:
              description: Opaque review token for delegated review-style submit paths.
              type: string
            agent_instructions:
              items:
                type: string
              type: array
            user_action_required:
              type: string
