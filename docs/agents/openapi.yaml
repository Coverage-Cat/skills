    UmbrellaFieldEstimateInput:
      additionalProperties: false
      description: |
        Metadata for one umbrella answer in the draft request whose current value is not directly user-confirmed yet. The actual value still comes from the `intake` patch at the same field path.
      properties:
        confidence:
          enum:
            - low
            - medium
            - high
          type: string
